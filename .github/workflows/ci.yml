name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax and metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.10
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Parse XML
        run: find etc view -type f -name '*.xml' -print0 | xargs -0 -n1 php -r 'libxml_use_internal_errors(true); if (!simplexml_load_file($argv[1])) { foreach (libxml_get_errors() as $error) { fwrite(STDERR, $error->message); } exit(1); }'
      - name: Check JavaScript syntax
        run: node --check view/adminhtml/web/js/progress.js

  magento:
    name: Magento ${{ matrix.magento }} / PHP ${{ matrix.php }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - magento: 2.4.4-p13
            php: '8.1'
            composer: '2.2'
          - magento: 2.4.5-p14
            php: '8.1'
            composer: '2.2'
          - magento: 2.4.6-p15
            php: '8.2'
            composer: '2.2'
          - magento: 2.4.7-p10
            php: '8.3'
            composer: '2.10'
          - magento: 2.4.8-p5
            php: '8.4'
            composer: '2.10'
          - magento: 2.4.9
            php: '8.5'
            composer: '2.10'
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: extension
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, simplexml, soap, sodium, xsl, zip
          coverage: none
          tools: composer:${{ matrix.composer }}
      - name: Create Magento project
        run: composer create-project --repository-url=https://repo.magento.com/ --no-interaction --no-progress magento/project-community-edition=${{ matrix.magento }} magento
      - name: Install extension in app/code
        run: |
          mkdir -p magento/app/code/Haroone/AdminReindex
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='docs' extension/ magento/app/code/Haroone/AdminReindex/
      - name: Enable Magento modules and extension
        working-directory: magento
        run: php bin/magento module:enable --all
      - name: Magento Coding Standard
        working-directory: magento
        run: vendor/bin/phpcs --standard=Magento2 --extensions=php app/code/Haroone/AdminReindex
      - name: Unit tests
        working-directory: magento
        run: vendor/bin/phpunit --no-configuration --bootstrap dev/tests/unit/framework/bootstrap.php app/code/Haroone/AdminReindex/Test/Unit
      - name: Dependency injection compilation
        working-directory: magento
        run: php bin/magento setup:di:compile

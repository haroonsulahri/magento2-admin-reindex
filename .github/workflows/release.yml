name: Release package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: source

      - name: Validate release tag
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, simplexml
          tools: composer:v2
          coverage: none

      - name: Build and verify release archive
        env:
          BUILD_SOURCE_DIR: ${{ github.workspace }}/source
        run: bash tooling/bin/build-release.sh "${RELEASE_TAG#v}" dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
